<!-- templates/includes/header.html -->
{% load static %}

<header class="w-full h-16 bg-white/70 backdrop-blur-md border-b border-[#b5baff]/20 px-6 flex items-center justify-between z-10">
  <!-- Left Header: Mobile Menu and Section Title -->
  <div class="flex items-center gap-4">
    <!-- Mobile Hamburger Toggle button (useful for responsive design) -->
    <button 
      id="mobile-sidebar-toggle"
      class="md:hidden p-2 rounded-xl text-slate-600 hover:bg-white border border-[#b5baff]/25 transition"
      onclick="toggleMobileSidebar()"
    >
      <i class="ti ti-menu-2 text-xl"></i>
    </button>
    
    <div>
      <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest block leading-none">Pakistan Labor Platform</span>
      <h2 class="font-display font-bold text-lg text-slate-900 leading-tight">
        {% block header_title %}Workverse Workspace{% endblock %}
      </h2>
    </div>
  </div>

  <!-- Right Header: Status Indicator or Quick Actions -->
  <div class="flex items-center gap-3">
    <!-- Active Status Indicator (Elegant minimalist element matching palette) -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1 bg-[#d9f9df] text-emerald-800 rounded-full text-xs font-semibold border border-emerald-500/10">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>Karachi / Lahore / Islamabad</span>
    </div>

    <!-- Help Icon link -->
    <a 
      href="{% url 'contact' %}" 
      class="p-2 rounded-xl text-slate-500 hover:text-[#9fa1ff] hover:bg-white/80 border border-transparent hover:border-[#b5baff]/30 transition"
      title="Contact Support Center"
    >
      <i class="ti ti-help text-lg"></i>
    </a>
    
    <!-- User Quick Circle status if logged in -->
    {% if request.user.is_authenticated %}
      <div class="h-8 w-px bg-slate-200 mx-1"></div>
      <div class="flex items-center gap-2">
        <span class="hidden md:inline text-xs font-bold text-slate-700">{{ request.user.name }}</span>
        <div class="w-8 h-8 rounded-xl bg-[#b5baff]/20 text-[#9fa1ff] font-bold flex items-center justify-center text-xs border border-[#b5baff]/40">
          {{ request.user.name|slice:":1" }}
        </div>
      </div>
    {% endif %}
  </div>
</header>

<script>
  // Simple responsive sidebar toggle helper
  function toggleMobileSidebar() {
    const sidebar = document.querySelector('aside');
    if (sidebar) {
      sidebar.classList.toggle('hidden');
      sidebar.classList.toggle('flex');
    }
  }
</script>
